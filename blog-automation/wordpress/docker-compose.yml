# ============================================================
#  워드프레스 자동 배포 - 이 파일 하나로 블로그가 뜬다.
#
#  사용:
#    1) cp .env.example .env   (그리고 값 수정 - 특히 비밀번호/도메인)
#    2) docker compose up -d
#    3) 잠시 후 http://서버IP:8080 접속 → 블로그 완성
#    4) docker compose logs wpcli   # 여기 출력된 '앱 비밀번호'를
#       자동화 툴킷의 ../.env 의 WP_APP_PASSWORD 에 복붙
#
#  구성: WordPress(Apache+PHP) + MariaDB + wp-cli 자동세팅
# ============================================================
services:
  db:
    image: mariadb:11
    restart: always
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME:-wordpress}
      MARIADB_USER: ${WP_DB_USER:-wpuser}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:-changeme_db}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:-changeme_root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6-php8.3-apache
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WP_DB_USER:-wpuser}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-changeme_db}
    volumes:
      - wp_data:/var/www/html

  # 워드프레스가 뜨면 한 번 실행되어 자동 세팅 후 종료
  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WP_DB_USER:-wpuser}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-changeme_db}
      WP_URL: ${WP_URL:-http://localhost:8080}
      WP_TITLE: ${WP_TITLE:-내 수익형 블로그}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-changeme_admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - wp_data:/var/www/html
      - ./setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh"]

volumes:
  db_data:
  wp_data:
